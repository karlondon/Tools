name: Deploy NarrativeAI to Production

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd NarrativeAI
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          cd NarrativeAI
          pytest test_main.py -v || true
  
  deploy:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Verify index.html exists locally
        run: |
          echo "📋 Checking local index.html..."
          ls -lh NarrativeAI/index.html
          echo "📊 File size and line count:"
          wc -c NarrativeAI/index.html
          wc -l NarrativeAI/index.html
          echo "🔍 Checking for tier-select dropdown..."
          grep -c "tier-select" NarrativeAI/index.html && echo "✅ Found tier-select dropdown" || echo "❌ Warning: tier-select not found"

      
      - name: Deploy to production server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          
          # Deploy files
          scp -i ~/.ssh/deploy_key -r NarrativeAI/* "$DEPLOY_USER@$DEPLOY_HOST:/home/ubuntu/NarrativeAI/"
           
           # Verify index.html was deployed
           echo "📋 Verifying index.html on server..."
           if [ -f /home/ubuntu/NarrativeAI/index.html ]; then
             echo "✅ index.html exists on server"
             ls -lh /home/ubuntu/NarrativeAI/index.html
             echo "🔍 Checking for tier-select in deployed file..."
             grep -c "tier-select" /home/ubuntu/NarrativeAI/index.html && echo "✅ Tier selection features found!" || echo "❌ Warning: tier-select not found in deployed file"
           else
             echo "❌ ERROR: index.html not found on server!"
             ls -la /home/ubuntu/NarrativeAI/
             exit 1
           fi

          
          # Restart the backend service
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
          cd /home/ubuntu/NarrativeAI
          
          # Kill old process
          pkill -f "python3 main.py" || true
          sleep 2
          
          # Install dependencies on server
          pip install -q -r requirements.txt
          
          # Start new process
          nohup python3 main.py > /tmp/narrativeai.log 2>&1 &
          sleep 3
          
          # Verify process is running
          if pgrep -f "python3 main.py" > /dev/null; then
            echo "✅ NarrativeAI backend started successfully on port 8000"
          else
            echo "❌ Failed to start backend"
            cat /tmp/narrativeai.log
            exit 1
          fi
          EOF
      
      - name: Verify deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "Waiting for service to be ready..."
          sleep 5
          
          # Check if backend is responding
          response=$(curl -s -o /dev/null -w "%{http_code}" "http://$DEPLOY_HOST:8000/api/free-tier" || echo "000")
          if [ "$response" = "200" ]; then
            echo "✅ Deployment successful! Backend is responding."
          else
            echo "⚠️ Backend returned status: $response"
            echo "Check logs on server with: tail -f /tmp/narrativeai.log"
          fi

